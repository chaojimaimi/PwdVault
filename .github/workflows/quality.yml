name: Quality Gates

# §5.6.4 unified quality pipeline. Runs on every push to main and on every PR.
# These gates MUST pass before any stable release tag is accepted.
#
# Jobs:
#   quality-frontend  — Node/pnpm pinned, tsc, vitest, ESLint
#   quality-rust      — fmt, clippy -D warnings, test --locked (workspace)
#   quality-native-host — fmt, clippy, test (native host binary)
#   security          — cargo deny, cargo audit, pnpm audit, gitleaks
#   version-consistency — 7-source version alignment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Pinned versions (§5.6.4): exact Node and pnpm major.minor to avoid
# drift between CI runs.
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: type-check, lint, test
  # ---------------------------------------------------------------------------
  quality-frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d6324d9847fb17c88f7f7b56e9e9e2ce1a1e3c4a # v4
      - uses: pnpm/action-setup@fe1f81f874a0c52c5a46f579b07807c8733132c5 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@1e60f620b9521f160767bc8cbe53c66c3d8d6c1b # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        run: pnpm tsc --noEmit
      - name: ESLint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Rust workspace: fmt, clippy, test
  # ---------------------------------------------------------------------------
  quality-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d6324d9847fb17c88f7f7b56e9e9e2ce1a1e3c4a # v4
      - uses: dtolnay/rust-toolchain@1482605bfc571978aded9373ebabf15505c99e91 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@a17f7ea6f727532c2c3b457b08a76588992d0231 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check --all
      - name: Clippy (deny warnings, all targets)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Rust native host: fmt, clippy, test
  # ---------------------------------------------------------------------------
  quality-native-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d6324d9847fb17c88f7f7b56e9e9e2ce1a1e3c4a # v4
      - uses: dtolnay/rust-toolchain@1482605bfc571978aded9373ebabf15505c99e91 # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting (native host)
        working-directory: extensions/native-host
        run: cargo fmt --check
      - name: Clippy (native host, deny warnings)
        working-directory: extensions/native-host
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests (native host)
        working-directory: extensions/native-host
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Security: cargo deny (advisories + licenses), cargo audit, pnpm audit,
  # gitleaks secret scan
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d6324d9847fb17c88f7f7b56e9e9e2ce1a1e3c4a # v4
      - uses: dtolnay/rust-toolchain@1482605bfc571978aded9373ebabf15505c99e91 # stable

      # cargo-deny: advisories (RUSTSEC allowlist in deny.toml) + licenses
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: cargo deny check (main app)
        working-directory: src-tauri
        run: cargo deny check --config ../deny.toml
      - name: cargo deny check (native host)
        working-directory: extensions/native-host
        run: cargo deny check --config ../../deny.toml

      # cargo-audit: additional vulnerability database cross-check
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: cargo audit (main app)
        working-directory: src-tauri
        run: cargo audit
      - name: cargo audit (native host)
        working-directory: extensions/native-host
        run: cargo audit

      # pnpm audit: frontend dependency vulnerabilities
      - uses: pnpm/action-setup@fe1f81f874a0c52c5a46f579b07807c8733132c5 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@1e60f620b9521f160767bc8cbe53c66c3d8d6c1b # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production deps)
        run: pnpm audit --prod --audit-level moderate

      # Gitleaks: scan for committed secrets
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@8e61c1f0c6dbb2c0f33f7d2d1be603b698467889 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Version consistency: ensure all 7 version sources agree
  # ---------------------------------------------------------------------------
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d6324d9847fb17c88f7f7b56e9e9e2ce1a1e3c4a # v4
      - name: Check version consistency
        run: bash scripts/bump-version.sh --check
