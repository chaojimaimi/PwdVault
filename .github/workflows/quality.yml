name: Quality Gates

# §5.6.4 unified quality pipeline. Runs on every push to main and on every PR.
# These gates MUST pass before any stable release tag is accepted.
#
# Jobs:
#   quality-frontend  — Node/pnpm pinned, tsc, vitest, ESLint
#   quality-rust      — fmt, clippy -D warnings, test --locked (workspace)
#   quality-native-host — fmt, clippy, test (native host binary)
#   security          — cargo deny, cargo audit, pnpm audit, gitleaks
#   version-consistency — 7-source version alignment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Pinned versions (§5.6.4): exact Node and pnpm major.minor to avoid
# drift between CI runs.
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: type-check, lint, test
  # ---------------------------------------------------------------------------
  quality-frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        run: pnpm tsc --noEmit
      - name: ESLint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Rust workspace: fmt, clippy, test
  # ---------------------------------------------------------------------------
  quality-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check --all
      - name: Clippy (deny warnings, all targets)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Rust native host: fmt, clippy, test
  # ---------------------------------------------------------------------------
  quality-native-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting (native host)
        working-directory: extensions/native-host
        run: cargo fmt --check
      - name: Clippy (native host, deny warnings)
        working-directory: extensions/native-host
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests (native host)
        working-directory: extensions/native-host
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Security: cargo deny (advisories + licenses), cargo audit, pnpm audit,
  # gitleaks secret scan
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable

      # cargo-deny: advisories (RUSTSEC allowlist in deny.toml) + licenses
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: cargo deny check (main app)
        working-directory: src-tauri
        run: cargo deny check --config ../deny.toml
      - name: cargo deny check (native host)
        working-directory: extensions/native-host
        run: cargo deny check --config ../../deny.toml

      # cargo-audit: additional vulnerability database cross-check
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: cargo audit (main app)
        working-directory: src-tauri
        run: cargo audit
      - name: cargo audit (native host)
        working-directory: extensions/native-host
        run: cargo audit

      # pnpm audit: frontend dependency vulnerabilities
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production deps)
        run: pnpm audit --prod --audit-level moderate

      # Gitleaks: scan for committed secrets
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Version consistency: ensure all 7 version sources agree
  # ---------------------------------------------------------------------------
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check version consistency
        run: bash scripts/bump-version.sh --check
