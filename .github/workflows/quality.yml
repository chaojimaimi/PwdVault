name: Quality Gates

# §5.6.4 unified quality pipeline. Runs on every push to main and on every PR.
# These gates MUST pass before any stable release tag is accepted.
#
# Jobs:
#   quality-frontend  — Node/pnpm pinned, tsc, vitest, ESLint
#   quality-rust      — fmt, clippy -D warnings, test --locked (workspace)
#   quality-native-host — fmt, clippy, test (native host binary)
#   quality-extension — deterministic Chrome/Firefox packages + strict Firefox lint
#   security          — cargo deny, cargo audit, pnpm audit, gitleaks
#   version-consistency — 10-source version alignment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Pinned versions (§5.6.4): exact Node and pnpm major.minor to avoid
# drift between CI runs.
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: type-check, lint, test
  # ---------------------------------------------------------------------------
  quality-frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        run: pnpm tsc --noEmit
      - name: ESLint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Rust workspace: fmt, clippy, test
  # ---------------------------------------------------------------------------
  quality-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Linux system dependencies (Tauri GTK/webkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      # Pre-build native-host binary so tauri-build's resource glob resolves.
      - name: Build native messaging host (placeholder for CI)
        run: |
          cd extensions/native-host
          cargo build --release
          mkdir -p ../../src-tauri/binaries
          cp target/release/pwdvault-native ../../src-tauri/binaries/ || true

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check --all
      - name: Clippy (deny warnings, all targets)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Rust native host: fmt, clippy, test
  # ---------------------------------------------------------------------------
  quality-native-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting (native host)
        working-directory: extensions/native-host
        run: cargo fmt --check
      - name: Clippy (native host, deny warnings)
        working-directory: extensions/native-host
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests (native host)
        working-directory: extensions/native-host
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Browser extensions: self-contained packages and Firefox store lint
  # ---------------------------------------------------------------------------
  quality-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and verify extension packages
        run: bash extensions/chrome/scripts/build.sh
      - name: Firefox web-ext lint (warnings are release blockers)
        run: >-
          pnpm --config.registry=https://registry.npmjs.org dlx web-ext@10.5.0 lint
          --source-dir extensions/firefox/dist --warnings-as-errors

  # ---------------------------------------------------------------------------
  # Security: cargo deny (advisories + licenses), cargo audit, pnpm audit,
  # gitleaks secret scan
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # cargo-deny: advisories (RUSTSEC allowlist in deny.toml) + licenses
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny check (main app)
        working-directory: src-tauri
        run: cargo deny --config ../deny.toml check
      - name: cargo deny check (native host)
        working-directory: extensions/native-host
        run: cargo deny --config ../../deny.toml check

      # cargo-audit: additional vulnerability database cross-check
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit (main app)
        working-directory: src-tauri
        run: cargo audit
      - name: cargo audit (native host)
        working-directory: extensions/native-host
        run: cargo audit

      # pnpm audit: frontend dependency vulnerabilities
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production deps)
        # Some developer mirrors do not implement npm's audit endpoint. Use
        # the canonical registry so this gate reports dependency risk rather
        # than mirror capability.
        run: pnpm --config.registry=https://registry.npmjs.org audit --prod --audit-level moderate

      # Gitleaks: scan for committed secrets
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Version consistency: ensure all 10 version sources agree
  # ---------------------------------------------------------------------------
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check version consistency
        run: bash scripts/bump-version.sh --check
