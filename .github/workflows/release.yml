name: Release

# §5.6.4 release pipeline. Triggered by tag push (v*) or manual dispatch.
# Depends on quality.yml passing (referenced via branch protection rules).
#
# Jobs:
#   release-gate      — quality + version + security re-check
#   build-macos       — DMG + app, conditional signing/notarize
#   build-windows     — NSIS, conditional Authenticode
#   build-extension   — Chrome + Firefox zip + store upload
#   provenance        — SBOM + SHA-256 + artifact attestation
#   create-release    — GitHub Release (prerelease if unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.6)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '11'

jobs:
  # ---------------------------------------------------------------------------
  # Release gate: quality + version consistency must pass
  # ---------------------------------------------------------------------------
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Version consistency check
        run: bash scripts/bump-version.sh --check

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        run: pnpm tsc --noEmit
      - name: Frontend tests
        run: pnpm test

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Clippy (workspace, deny warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (workspace)
        working-directory: src-tauri
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # macOS build with conditional signing/notarization (§5.6.6 #6/#8)
  # ---------------------------------------------------------------------------
  build-macos:
    needs: release-gate
    runs-on: macos-latest
    outputs:
      signing-status: ${{ steps.secrets.outputs.macos_certs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check signing secrets
        id: secrets
        run: bash scripts/check-signing-secrets.sh >> "$GITHUB_OUTPUT"
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Import code signing certificate
        if: steps.secrets.outputs.macos_certs == 'true'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build macOS app
        run: pnpm tauri build --bundles dmg,app
        env:
          APPLE_SIGNING_IDENTITY: "${{ steps.secrets.outputs.macos_certs == 'true' && 'Developer ID Application: PwdVault' || '-' }}"

      - name: Notarize app
        if: steps.secrets.outputs.macos_certs == 'true'
        uses: lando/notarize-action@b5c3ef16cf2fbcf2af26dc58c90255ec242abeed # v2
        with:
          product-path: src-tauri/target/release/bundle/macos/PwdVault.app
          apple-id: ${{ secrets.APPLE_ID }}
          password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Staple and verify
        if: steps.secrets.outputs.macos_certs == 'true'
        run: |
          xcrun stapler staple src-tauri/target/release/bundle/macos/PwdVault.app
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/PwdVault.app
          spctl --assess --type execute --verbose src-tauri/target/release/bundle/macos/PwdVault.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  # ---------------------------------------------------------------------------
  # Windows build with conditional Authenticode (§5.6.6 #7/#8)
  # ---------------------------------------------------------------------------
  build-windows:
    needs: release-gate
    runs-on: windows-latest
    outputs:
      signing-status: ${{ steps.secrets.outputs.windows_certs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check signing secrets
        id: secrets
        shell: bash
        run: bash scripts/check-signing-secrets.sh >> "$GITHUB_OUTPUT"
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build Windows app
        run: pnpm tauri build --bundles nsis

      - name: Sign Windows executable
        if: steps.secrets.outputs.windows_certs == 'true'
        # VULN-002: pin to commit SHA when certificate is provisioned.
        # Replace @v4 with @<full-40-char-SHA> from the v4 tag before first
        # stable release that actually signs Windows builds.
        uses: gtarnaras/code-sign-action@v4
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          folder: src-tauri/target/release/bundle/nsis/

      - name: Verify signature
        if: steps.secrets.outputs.windows_certs == 'true'
        shell: powershell
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature status: $($sig.Status)" }
          Write-Host "Signature: Valid"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ---------------------------------------------------------------------------
  # Browser extension build + store upload (§5.6.4 package, §6a)
  # ---------------------------------------------------------------------------
  build-extension:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build extensions
        run: bash extensions/chrome/scripts/build.sh

      - name: Verify packages
        run: bash extensions/tests/verify_package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-artifacts
          path: |
            extensions/chrome/PwdVault-Chrome-Extension-*.zip
            extensions/firefox/PwdVault-Firefox-Extension-*.zip

      # Chrome Web Store upload (skipped if secrets absent)
      - name: Upload to Chrome Web Store
        if: env.CHROME_CLIENT_ID != ''
        continue-on-error: true
        uses: trmcnvn/chrome-webstore-upload-cli@v2 # v2.2.0
        with:
          file: extensions/chrome/PwdVault-Chrome-Extension-*.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: false
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}

      # Firefox AMO signing (skipped if secrets absent)
      - name: Sign for Firefox AMO
        if: env.AMO_API_KEY != ''
        continue-on-error: true
        run: |
          npx web-ext sign \
            --source-dir extensions/firefox \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET"
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}

  # ---------------------------------------------------------------------------
  # Provenance: SBOM + SHA-256 + artifact attestation (§5.6.4 provenance)
  # ---------------------------------------------------------------------------
  provenance:
    needs: [build-macos, build-windows, build-extension]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          find . -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Generate Rust SBOM (CycloneDX)
        # VULN-002: pin to commit SHA before stable release.
        uses: CycloneDX/gh-cdxgen@v1
        with:
          path: src-tauri
          output: artifacts/rust-bom.cdx.json

      - name: Generate npm SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file artifacts/npm-bom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/SHA256SUMS
            artifacts/*bom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-artifacts
          path: |
            artifacts/SHA256SUMS
            artifacts/*bom.cdx.json

  # ---------------------------------------------------------------------------
  # Create GitHub Release (prerelease if any platform unsigned — §5.6.6 #8)
  # ---------------------------------------------------------------------------
  create-release:
    needs: [build-macos, build-windows, build-extension, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Determine prerelease status
        id: prerelease
        run: |
          MACOS="${{ needs.build-macos.outputs.signing-status }}"
          WINDOWS="${{ needs.build-windows.outputs.signing-status }}"
          if [ "$MACOS" != "true" ] || [ "$WINDOWS" != "true" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "⚠️  One or more platforms unsigned — marking as prerelease (§5.6.6-8)"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Read CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CLEAN="${VERSION#v}"
          if grep -q "\[$VERSION_CLEAN\]" CHANGELOG.md; then
            awk "/\[$VERSION_CLEAN\]/,/^## / {print}" CHANGELOG.md | head -n -1 > release_notes.txt
          else
            head -50 CHANGELOG.md > release_notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          body_path: release_notes.txt
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/SHA256SUMS
            artifacts/**/*bom.cdx.json
