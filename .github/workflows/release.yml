name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # Release gate: all quality gates must pass before any build job starts.
  # This prevents publishing a release that fails fmt/clippy/tests/version
  # checks. (Phase 0 of the Comprehensive Optimization Plan v1.0.5)
  # ---------------------------------------------------------------------------
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Check formatting (main app)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (main app, deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests (main app)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check formatting (native host)
        working-directory: extensions/native-host
        run: cargo fmt --check

      - name: Clippy (native host, deny warnings)
        working-directory: extensions/native-host
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests (native host)
        working-directory: extensions/native-host
        run: cargo test --locked

      - name: Security audit (main app)
        working-directory: src-tauri
        run: |
          cargo install cargo-audit
          cargo audit

      - name: Version consistency check
        run: |
          set -euo pipefail
          PKG_JSON=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          CARGO_MAIN=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAURI_CONF=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          CHROME=$(python3 -c "import json; print(json.load(open('extensions/chrome/manifest.json'))['version'])")
          FIREFOX=$(python3 -c "import json; print(json.load(open('extensions/firefox/manifest.json'))['version'])")
          for v in "$CARGO_MAIN" "$TAURI_CONF" "$CHROME" "$FIREFOX"; do
            if [ "$v" != "$PKG_JSON" ]; then
              echo "❌ Version mismatch: expected $PKG_JSON, got $v"
              exit 1
            fi
          done
          echo "✅ All product versions aligned at $PKG_JSON"

  build-macos:
    needs: release-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build native messaging host (arm64 + x86_64 universal)
        run: |
          cargo build --release --manifest-path extensions/native-host/Cargo.toml \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p src-tauri/binaries
          # Merge into a universal binary so the same bundle runs on both archs
          lipo -create \
            extensions/native-host/target/aarch64-apple-darwin/release/pwdvault-native \
            extensions/native-host/target/x86_64-apple-darwin/release/pwdvault-native \
            -output src-tauri/binaries/pwdvault-native
          chmod +x src-tauri/binaries/pwdvault-native

      - name: Build macOS app (DMG + app bundle)
        run: pnpm tauri build --bundles dmg,app
        env:
          APPLE_SIGNING_IDENTITY: '-'

      - name: Package macOS release
        run: |
          mkdir -p releases/macos
          # Copy DMG
          cp src-tauri/target/release/bundle/dmg/*.dmg releases/macos/ || true
          # Create zip of app bundle
          if [ -d "src-tauri/target/release/bundle/macos/PwdVault.app" ]; then
            cd src-tauri/target/release/bundle/macos
            zip -r "${GITHUB_WORKSPACE}/releases/macos/PwdVault-macOS-app.zip" PwdVault.app
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PwdVault-macOS
          path: releases/macos/*

  build-windows:
    needs: release-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build native messaging host (x86_64)
        run: |
          cargo build --release --manifest-path extensions/native-host/Cargo.toml --target x86_64-pc-windows-msvc
          mkdir -p src-tauri/binaries
          copy extensions\native-host\target\x86_64-pc-windows-msvc\release\pwdvault-native.exe src-tauri\binaries\pwdvault-native.exe

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - name: Package Windows release
        run: |
          mkdir releases/windows
          copy src-tauri\target\release\bundle\nsis\*.exe releases\windows\

      - uses: actions/upload-artifact@v4
        with:
          name: PwdVault-Windows
          path: releases/windows/*

  build-extension:
    needs: release-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Chrome extension
        run: |
          mkdir -p releases/chrome-extension
          cd extensions/chrome
          zip -r ../../releases/chrome-extension/PwdVault-Chrome-Extension.zip . -x "*.DS_Store" "test-page.html" "TEST_RESULTS.md"

      - name: Package Firefox extension (self-contained, no symlinks)
        run: |
          mkdir -p releases/firefox-extension
          # Firefox extension uses symlinks to ../chrome/ in source.
          # Shipping symlinks in a distributed zip breaks on Windows and
          # any system without the chrome/ directory. Build a staging
          # directory with real copies instead.
          mkdir -p /tmp/firefox-staging
          cp extensions/firefox/manifest.json /tmp/firefox-staging/
          # Resolve and copy shared source (dereference symlinks)
          cp -rL extensions/firefox/src /tmp/firefox-staging/src
          cp -rL extensions/firefox/icons /tmp/firefox-staging/icons
          cd /tmp/firefox-staging
          zip -r "$GITHUB_WORKSPACE/releases/firefox-extension/PwdVault-Firefox-Extension.zip" . -x "*.DS_Store"

      - name: Verify extension packages
        run: |
          chmod +x extensions/tests/verify_package.sh
          bash extensions/tests/verify_package.sh \
            releases/chrome-extension/PwdVault-Chrome-Extension.zip \
            releases/firefox-extension/PwdVault-Firefox-Extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PwdVault-Chrome-Extension
          path: releases/chrome-extension/*

      - uses: actions/upload-artifact@v4
        with:
          name: PwdVault-Firefox-Extension
          path: releases/firefox-extension/*

  create-release:
    needs: [build-macos, build-windows, build-extension]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Selected version: $VERSION"

      - name: Read CHANGELOG
        id: changelog
        run: |
          # Extract changelog for this version
          VERSION=${{ steps.get_version.outputs.version }}
          # Remove 'v' prefix for CHANGELOG matching
          VERSION_CLEAN=${VERSION#v}

          if [ -f CHANGELOG.md ]; then
            # Try different version formats
            if grep -q "\[$VERSION_CLEAN\]" CHANGELOG.md; then
              # Format: [0.2.0.0]
              awk "/\[$VERSION_CLEAN\]/,/^## / {print}" CHANGELOG.md | head -n -1 > release_notes.txt
            elif grep -q "## $VERSION" CHANGELOG.md; then
              # Format: ## v0.2.0
              awk "/## $VERSION/,/^## / {print}" CHANGELOG.md | head -n -1 > release_notes.txt
            else
              # Fallback: get first 50 lines
              head -50 CHANGELOG.md > release_notes.txt
            fi
          else
            echo "See CHANGELOG.md for details" > release_notes.txt
          fi

          echo "Release notes preview:"
          head -20 release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: PwdVault ${{ steps.get_version.outputs.version }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            artifacts/PwdVault-macOS/*.*
            artifacts/PwdVault-Windows/*.*
            artifacts/PwdVault-Chrome-Extension/*.*
            artifacts/PwdVault-Firefox-Extension/*.*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
