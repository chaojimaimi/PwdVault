<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ext-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#ext-grad)"/>

  <!-- Simplified data flow arcs -->
  <path d="M 20 105 Q 42 82, 50 65 Q 62 40, 80 32 Q 98 24, 108 16"
        fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M 28 112 Q 48 92, 56 78 Q 66 52, 82 44 Q 96 36, 112 22"
        fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Lock shackle -->
  <path d="M 46 52 L 46 38 Q 46 22, 64 22 Q 82 22, 82 38 L 82 52"
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lock body -->
  <rect x="34" y="52" width="60" height="50" rx="10" fill="#FFFFFF"/>

  <!-- Keyhole -->
  <circle cx="64" cy="71" r="8" fill="#0D6E64"/>
  <rect x="60" y="71" width="8" height="14" rx="4" fill="#0D6E64"/>

  <!-- Data dots -->
  <circle cx="50" cy="65" r="2" fill="#5EEAD4" opacity="0.5"/>
  <circle cx="108" cy="16" r="2" fill="#5EEAD4" opacity="0.4"/>
</svg>
