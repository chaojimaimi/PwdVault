<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5EEAD4;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="flow-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#5EEAD4;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square (iOS squircle approximation) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Data flow lines (behind lock) -->
  <!-- Flow line 1: sweeping arc bottom-left to top-right -->
  <path d="M 80 420 Q 140 380, 160 340 Q 200 260, 256 240 Q 312 220, 360 180 Q 400 148, 432 92"
        fill="none" stroke="url(#flow-grad)" stroke-width="6" stroke-linecap="round"
        opacity="0.4"/>
  <!-- Flow line 2: parallel arc -->
  <path d="M 100 440 Q 160 400, 180 360 Q 220 280, 272 262 Q 328 242, 372 204 Q 408 172, 440 112"
        fill="none" stroke="url(#flow-grad-2)" stroke-width="4" stroke-linecap="round"
        opacity="0.3"/>
  <!-- Flow line 3: subtle lower arc -->
  <path d="M 60 400 Q 120 370, 148 330 Q 180 270, 240 256"
        fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"
        opacity="0.25"/>
  <!-- Flow line 4: subtle upper arc -->
  <path d="M 280 230 Q 340 210, 380 160 Q 410 120, 448 76"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"
        opacity="0.2"/>

  <!-- Data dots on flow lines -->
  <circle cx="148" cy="330" r="4" fill="#5EEAD4" opacity="0.6"/>
  <circle cx="380" cy="160" r="4" fill="#5EEAD4" opacity="0.6"/>
  <circle cx="240" cy="256" r="3.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="372" cy="204" r="3.5" fill="#FFFFFF" opacity="0.4"/>

  <!-- Lock body -->
  <g transform="translate(256, 268)">
    <!-- Lock shackle (U-shape above body) -->
    <path d="M -48 -72 L -48 -112 Q -48 -148, 0 -148 Q 48 -148, 48 -112 L 48 -72"
          fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lock body (rounded rectangle) -->
    <rect x="-72" y="-72" width="144" height="120" rx="16" fill="#FFFFFF"/>

    <!-- Keyhole -->
    <circle cx="0" cy="8" r="18" fill="#0D6E64"/>
    <rect x="-7" y="8" width="14" height="28" rx="7" fill="#0D6E64"/>
  </g>

  <!-- Data flow lines (in front of lock, creating depth) -->
  <!-- Small circuit traces near lock -->
  <path d="M 160 310 Q 130 320, 110 350"
        fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"
        opacity="0.35" filter="url(#glow)"/>
  <path d="M 352 240 Q 382 230, 402 200"
        fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"
        opacity="0.35" filter="url(#glow)"/>

  <!-- Small data nodes -->
  <circle cx="110" cy="350" r="3" fill="#5EEAD4" opacity="0.5"/>
  <circle cx="402" cy="200" r="3" fill="#5EEAD4" opacity="0.5"/>
</svg>
