# cargo-audit configuration (read from the CURRENT WORKING DIRECTORY only —
# no parent search — so every `cargo audit` invocation must run from the repo
# root with an explicit `--file <path>/Cargo.lock`, as both quality.yml and
# release.yml do).
#
# Rationale and expiry live in docs/SECURITY-ADVISORY-ALLOWLIST.md; the
# machine-checked allowlist for cargo-deny lives in deny.toml
# ([advisories].ignore). Keep all three in sync.
#
# Run: cargo audit --file src-tauri/Cargo.lock
#      cargo audit --file extensions/native-host/Cargo.lock
# Docs: https://rustsec.org/ (cargo-audit book: audit.toml semantics)

[advisories]
ignore = [
    # zip 4.x (transitive of tauri-plugin-updater) — update-archive
    # extraction symlink permission escape / SUID+SGID preservation. Fix
    # requires zip >= 9, but per the 2026-10-25 crates.io check every
    # released tauri-plugin-updater version (2.x incl. 2.14.0 AND
    # 3.0.0-alpha.3) pins zip ^4 — zip >= 9 does not exist upstream, so
    # v1.4.0 took the 2.x-latest plugin (2.14.0, wry 0.54 -> 0.57) and the
    # allowlist rides on with a new expiry. Exploit requires breaking the
    # minisign signature chain (golden_contract byte-pinned in CI) or an
    # https downgrade. Expiry 2027-06-30: remove in the next minor once any
    # Tauri version line ships zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
