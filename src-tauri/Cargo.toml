[package]
name = "pwdvault"
version = "1.0.5"
description = "A secure, local-first password manager"
authors = ["andylee"]
edition = "2021"

[lib]
name = "pwdvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ---------------------------------------------------------------------------
# Workspace (§5.6.3) — PwdVault is split into domain / infrastructure /
# application workspace crates. This crate is the Tauri binary (tauri-app
# adapter layer) + the Native Messaging HTTP server.
# ---------------------------------------------------------------------------
[workspace]
members = ["crates/domain", "crates/infrastructure", "crates/application"]

# Required for production binaries to serve the embedded frontend through
# Tauri's application protocol instead of trying the Vite development URL.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace members — all business logic lives in these crates.
pwdvault-domain = { path = "crates/domain" }
pwdvault-infrastructure = { path = "crates/infrastructure" }
pwdvault-application = { path = "crates/application" }

# Tauri runtime
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization (native_messaging HTTP JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive", "serde"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
bincode = "1"
redb = "2"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vault_bench"
harness = false
