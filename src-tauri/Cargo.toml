[package]
name = "pwdvault"
version = "1.0.5"
description = "A secure, local-first password manager"
authors = ["andylee"]
edition = "2021"

[lib]
name = "pwdvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Required for production binaries to serve the embedded frontend through
# Tauri's application protocol instead of trying the Vite development URL.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Cryptography
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive", "serde"] }
subtle = "2"
typenum = "1"

# Database
redb = "2"
bincode = "1"

# Utilities
thiserror = "2"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"

# HTTP server for native messaging

# Update checker
ureq = { version = "3", features = ["json"] }
semver = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Native messaging host registration (Windows registry)
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vault_bench"
harness = false
