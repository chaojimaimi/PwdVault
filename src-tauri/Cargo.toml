[package]
name = "pwdvault"
version = "0.0.1"
description = "A secure, local-first password manager"
authors = ["andylee"]
edition = "2021"

[lib]
name = "pwdvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
typenum = "1"

# Database
redb = "2"
bincode = "1"

# Utilities
thiserror = "2"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"

# HTTP server for native messaging
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
