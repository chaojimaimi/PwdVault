[package]
name = "pwdvault"
version = "1.8.7"
description = "A secure, local-first password manager"
authors = ["andylee"]
license = "MIT"
edition = "2021"

[lib]
name = "pwdvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ---------------------------------------------------------------------------
# Workspace (§5.6.3) — PwdVault is split into domain / infrastructure /
# application workspace crates. This crate is the Tauri binary (tauri-app
# adapter layer) + the Native Messaging HTTP server.
# ---------------------------------------------------------------------------
[workspace]
members = ["crates/domain", "crates/infrastructure", "crates/application"]

# Required for production binaries to serve the embedded frontend through
# Tauri's application protocol instead of trying the Vite development URL.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace members — all business logic lives in these crates.
pwdvault-domain = { version = "1.1.0", path = "crates/domain" }
pwdvault-infrastructure = { version = "1.1.0", path = "crates/infrastructure" }
pwdvault-application = { version = "1.1.0", path = "crates/application" }

# Tauri runtime
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# M11: system clipboard access from the webview so auto-clear works even when
# the window is not OS-focused (navigator.clipboard is focus-gated).
tauri-plugin-clipboard-manager = "2"

# Serialization (native_messaging HTTP JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive", "serde"] }

# Listener socket options (SO_REUSEADDR) for the native messaging server —
# already a transitive dependency at 0.6, so no extra copy is vendored.
socket2 = "0.6"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# WP5 (v1.4.0): show-and-focus-the-vault hotkey. Registration happens in
# Rust (shortcuts.rs + register_global_shortcut command); capabilities grant
# only allow-register/unregister/is-registered.
tauri-plugin-global-shortcut = "2"

# v1.8.6: AppKit occlusion-state observer for the Touch ID prompt cancel
# (registration block in lib.rs). Target-scoped like the infrastructure objc2
# stack so Windows/Linux builds never pull them: `ns_window()` is a
# macOS-cfg tauri API and objc2 `compile_error!`s on non-Apple targets, so an
# ungated dependency here would break the Windows release CI (v1.8.5 R1-P1).
# Feature names are the REAL objc2-foundation gate names — NSNotificationCenter
# lives under "NSNotification" and NSOperationQueue under "NSOperation"; there
# is no control-named feature. All three crates are already in the lockfile
# transitively (objc2 0.6.4 / objc2-foundation 0.3.2 / block2 0.6.2), so this
# adds zero new packages — only the pwdvault entry's dependency list grows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSNotification",
    "NSOperation",
    "block2",
] }

[dev-dependencies]
tempfile = "3"
redb = "2"
# tauri "test" feature provides mock_app()/mock_builder() so IPC command
# wrappers (which need a managed State) can be unit tested. Dev-only: the
# feature is never enabled for production builds.
tauri = { version = "2", features = ["test"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vault_bench"
harness = false
