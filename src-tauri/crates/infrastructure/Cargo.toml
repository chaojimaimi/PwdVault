[package]
name = "pwdvault-infrastructure"
version = "1.1.4"
edition = "2021"
description = "PwdVault infrastructure — redb repository, crypto, filesystem, native host setup"
license = "MIT"

[lib]
name = "pwdvault_infrastructure"
path = "src/lib.rs"

[dependencies]
pwdvault-domain = { version = "1.1.0", path = "../domain" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"

# Cryptography
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive", "serde"] }
subtle = "2"
typenum = "1"

# Database
redb = "2"

# Utilities
thiserror = "2"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tracing = "0.1"

# Native messaging host registration (Windows registry)
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
