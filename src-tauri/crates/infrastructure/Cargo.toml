[package]
name = "pwdvault-infrastructure"
version = "1.1.6"
edition = "2021"
description = "PwdVault infrastructure — redb repository, crypto, filesystem, native host setup"
license = "MIT"

[lib]
name = "pwdvault_infrastructure"
path = "src/lib.rs"

[dependencies]
pwdvault-domain = { version = "1.1.0", path = "../domain" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"

# Cryptography
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive", "serde"] }
subtle = "2"
typenum = "1"

# Database
redb = "2"

# Utilities
thiserror = "2"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tracing = "0.1"

# Native messaging host registration (Windows registry)
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# macOS Keychain + LocalAuthentication for biometric unlock (Phase 1).
# Platform-scoped like winreg above so Windows/Linux builds never pull them.
# - security-framework: SecItem dictionary path (ACLs are not exposed by the
#   high-level `passwords` module); OSX_10_15 enables kSecUseDataProtectionKeychain.
# - objc2-local-authentication: LAContext canEvaluatePolicy availability check
#   plus the explicit evaluatePolicy gate that protects legacy-keychain bio
#   items (the "block2" feature is required for its reply-block signature).
#   objc2 0.6 / objc2-foundation 0.3 / block2 0.6 are already in the
#   dependency tree, so no extra copies.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = { version = "2", features = ["OSX_10_15"] }
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSString",
] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "LAContext",
    "block2",
] }

[dev-dependencies]
tempfile = "3"
