[package]
name = "pwdvault-domain"
version = "1.7.0"
edition = "2021"
description = "PwdVault domain model — entities, DTOs, validation policy, error codes"
license = "MIT"

[lib]
name = "pwdvault_domain"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["derive", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# v1.7.0 WP1: pattern-entropy scoring for the dashboard weak-password verdict.
# Exact-pinned: the classification vectors (fix_impl_plan_v1.7.0.md Appendix B)
# are frozen against this zxcvbn version — a minor bump can silently re-score.
zxcvbn = "=3.1.1"
