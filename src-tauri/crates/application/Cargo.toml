[package]
name = "pwdvault-application"
version = "1.1.2"
edition = "2021"
description = "PwdVault application layer — vault lifecycle, CRUD, backup, session use cases"
license = "MIT"

[lib]
name = "pwdvault_application"
path = "src/lib.rs"

[dependencies]
pwdvault-domain = { version = "1.1.0", path = "../domain" }
pwdvault-infrastructure = { version = "1.1.0", path = "../infrastructure" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"

# Crypto types appear in signatures (SecretKey, VerificationData)
zeroize = { version = "1", features = ["derive", "serde"] }

# Database handle leaks through get_db() (pragmatic; see §5.6.3 analysis)
redb = "2"

# Utilities
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

# Update check
ureq = { version = "3", features = ["json"] }
semver = "1"

# Structured logging (service modules emit tracing events)
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
