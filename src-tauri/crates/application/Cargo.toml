[package]
name = "pwdvault-application"
version = "1.1.5"
edition = "2021"
description = "PwdVault application layer — vault lifecycle, CRUD, backup, session use cases"
license = "MIT"

[lib]
name = "pwdvault_application"
path = "src/lib.rs"

[dependencies]
pwdvault-domain = { version = "1.1.0", path = "../domain" }
pwdvault-infrastructure = { version = "1.1.0", path = "../infrastructure" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"

# SHA-256 for the D3 merge tiebreak fingerprint (service/sync) — same 0.10
# line the infrastructure crate already vendors, so no new copy.
sha2 = "0.10"

# Crypto types appear in signatures (SecretKey, VerificationData)
zeroize = { version = "1", features = ["derive", "serde"] }
# Constant-time comparison for the master-key verification helper (same
# primitive verification.rs uses; single shared version in the workspace).
subtle = "2"

# Database handle leaks through get_db() (pragmatic; see §5.6.3 analysis)
redb = "2"

# Utilities
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

# Update check + WebDAV sync backend (P3.2). 3.4+ is required for
# allow_non_standard_methods (PROPFIND/MKCOL — ureq#1015, fixed in 3.4.2).
ureq = { version = "3.4", features = ["json"] }
semver = "1"

# Structured logging (service modules emit tracing events)
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# P3.6 item 5: hand-written WebDAV stub server for the backend tests.
tiny_http = "0.12"
