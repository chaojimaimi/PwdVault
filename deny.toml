# cargo-deny configuration (§5.6.4 security + license policy).
#
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# RUSTSEC warnings are allowed but tracked. Unallowed advisories fail the
# check. Each ignore entry below has a reason and should carry an expiry.
# See docs/SECURITY-ADVISORY-ALLOWLIST.md for the full rationale table.
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    # bincode — RUSTSEC-2025-0141 is a CRATE-LEVEL advisory ("unmaintained",
    # no patched version): it covers 1.x AND 2.x, so the v1.3.0 swap to
    # bincode 2.0.1 (final released API) does NOT clear it. Kept on the
    # allowlist because v1.3.0 landed the end-state 2.0.1 API plus a golden
    # byte-fixture guardrail (database/bincode_golden.rs + the sync
    # container fingerprint fixtures) and a single serialization seam
    # (crypto::codec bc_serialize/bc_deserialize) — migrating to postcard,
    # the only real advisory-clearing path, now touches that seam alone.
    # Re-evaluate when: bincode gets an actual CVE, or the next
    # format-level development starts. Routine review: 2027-10. Tracked in
    # docs/SECURITY-ADVISORY-ALLOWLIST.md.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained (crate-level, covers 2.x); on bincode 2.0.1 final API with golden-byte guardrail and single serialization seam; postcard migration only changes the seam" },
]
# Transitive unmaintained crates are reported as warnings. Direct workspace
# dependencies remain blocking unless explicitly reviewed above.
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Allow common permissive and weak-copyleft licenses. GPL/AGPL are rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # BSL-1.0 (permissive, OSI-approved): transitive Windows clipboard crates
    # clipboard-win / error-code pulled in by tauri-plugin-clipboard-manager
    # (M11).
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# Warn on duplicate dependencies; don't fail (Tauri pulls many transitives).
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
